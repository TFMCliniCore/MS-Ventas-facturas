version: '3.8'

services:
  ms-ventas-db:
    image: postgres:16-alpine
    container_name: clinicore-ventas-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5439}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ms_ventas_postgres_data:/var/lib/postgresql/data
    networks:
      - ms-ventas-net

  api-ventas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinicore-ms-ventas
    restart: unless-stopped
    depends_on:
      ms-ventas-db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@ms-ventas-db:5432/${POSTGRES_DB}?schema=public
      MS_INVENTARIO_URL: ${MS_INVENTARIO_URL}
      MS_ENTIDADES_CORE_URL: ${MS_ENTIDADES_CORE_URL}
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - ms_ventas_uploads:/app/uploads
      - ./facturas_locales:/app/facturas_locales
    command: sh -c "npx prisma generate && npx prisma db push && node dist/main"
    networks:
      - ms-ventas-net

volumes:
  ms_ventas_postgres_data:
  ms_ventas_uploads:

networks:
  ms-ventas-net:
    driver: bridge
    name: ms-ventas_default